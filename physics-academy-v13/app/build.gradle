plugins { id 'com.android.application' }
android {
    namespace 'com.godnit.physicsacademy'
    compileSdk 35
    defaultConfig {
        applicationId 'com.godnit.physicsacademy'
        minSdk 23
        targetSdk 35
        versionCode 15
        versionName '1.15'
    }
    signingConfigs {
        stable {
            storeFile file('physics-academy-key.jks')
            storePassword 'physicsacademy'
            keyAlias 'physics'
            keyPassword 'physicsacademy'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.stable }
        release { signingConfig signingConfigs.stable; minifyEnabled false }
    }
}
