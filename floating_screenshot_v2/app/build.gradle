plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maimon.floatingscreenshot'
    compileSdk 35

    defaultConfig {
        applicationId 'com.maimon.floatingscreenshot'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '2.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
