name: TripoSR Cottage House-Only V2

on:
  push:
    branches: [ ai-triposr-experiment ]
    paths:
      - 'references/cottage_house_only.png'
      - '.github/workflows/triposr-cottage-house-only-v2.yml'
      - 'scripts/ai/postprocess_triposr_v1.py'
  workflow_dispatch:

jobs:
  image-to-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify masked house reference
        run: |
          test -s references/cottage_house_only.png
          file references/cottage_house_only.png
      - name: Install Blender and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential cmake ninja-build libgl1 libglib2.0-0 blender xvfb libglu1-mesa
      - name: Clone official TripoSR
        run: |
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git external/TripoSR
          git -C external/TripoSR rev-parse HEAD | tee triposr_commit.txt
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -r external/TripoSR/requirements.txt
      - name: Reconstruct isolated house
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          mkdir -p triposr-raw
          python external/TripoSR/run.py references/cottage_house_only.png --output-dir triposr-raw --device cpu --mc-resolution 192
          OBJ_PATH="$(find triposr-raw -type f -name '*.obj' | head -n 1)"
          test -n "$OBJ_PATH" && test -s "$OBJ_PATH"
          printf '%s' "$OBJ_PATH" > triposr_obj_path.txt
      - name: Blender cleanup and preview
        run: |
          mkdir -p ai-output
          OBJ_PATH="$(cat triposr_obj_path.txt)"
          xvfb-run -a blender --background --python scripts/ai/postprocess_triposr_v1.py -- "$OBJ_PATH"
          test -s ai-output/triposr_model.blend
          test -s ai-output/triposr_model.glb
          test -s ai-output/triposr_preview_perspective.png
      - name: Collect experiment files
        if: always()
        run: |
          mkdir -p ai-output
          cp -f triposr_commit.txt ai-output/ 2>/dev/null || true
          OBJ_PATH="$(find triposr-raw -type f -name '*.obj' | head -n 1 || true)"
          if [ -n "$OBJ_PATH" ]; then cp -f "$OBJ_PATH" ai-output/triposr_raw.obj; fi
      - name: Upload V2 experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cottage-triposr-house-only-v2
          path: ai-output/
          if-no-files-found: warn
          compression-level: 6
