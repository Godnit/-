name: Build Task City APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'task_city_game/**'
      - '.github/workflows/build-task-city-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified V43 map artifact
        uses: actions/download-artifact@v4
        with:
          name: classic-reference-v43-natural-mountains
          path: _map_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Godnit/-
          run-id: 31722636867

      - name: Download verified cottage artifact
        uses: actions/download-artifact@v4
        with:
          name: reference-cottage-3d-v15
          path: _house_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Godnit/-
          run-id: 31811563821

      - name: Prepare game assets
        run: |
          mkdir -p task_city_game/assets task_city_game/build
          cp _map_artifact/classic_reference_v43.glb task_city_game/assets/classic_reference_v43.glb
          cp _house_artifact/model.glb task_city_game/assets/cottage.glb
          test -s task_city_game/assets/classic_reference_v43.glb
          test -s task_city_game/assets/cottage.glb
          godot --version
          ls -lh task_city_game/assets

      - name: Install complete Godot Android export templates
        run: |
          set -eux
          VERSION_DIR="4.3.stable"
          CACHE_TARGET="/root/.cache/godot/export_templates/${VERSION_DIR}"
          DATA_TARGET="/root/.local/share/godot/export_templates/${VERSION_DIR}"

          apt-get update
          apt-get install -y --no-install-recommends wget unzip ca-certificates
          rm -rf /tmp/godot_templates /tmp/templates.tpz "$CACHE_TARGET" "$DATA_TARGET"
          mkdir -p /tmp/godot_templates "$CACHE_TARGET" "$DATA_TARGET"

          wget -q --tries=3 --timeout=30 -O /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          cp -a /tmp/godot_templates/templates/. "$CACHE_TARGET/"
          cp -a /tmp/godot_templates/templates/. "$DATA_TARGET/"

          test -s "$CACHE_TARGET/android_debug.apk"
          test -s "$CACHE_TARGET/android_release.apk"
          test -s "$CACHE_TARGET/version.txt"
          test -s "$DATA_TARGET/android_debug.apk"
          test -s "$DATA_TARGET/version.txt"
          cat "$CACHE_TARGET/version.txt"

      - name: Create Android debug keystore
        run: |
          set -eux
          if ! command -v keytool >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends openjdk-17-jdk-headless
          fi
          mkdir -p /root/.android
          rm -f /root/.android/debug.keystore
          keytool -keyalg RSA -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore /root/.android/debug.keystore \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 \
            -deststoretype pkcs12
          test -s /root/.android/debug.keystore
          keytool -list -keystore /root/.android/debug.keystore -storepass android -alias androiddebugkey
          ls -lh /root/.android/debug.keystore

      - name: Import project and validate scripts
        working-directory: task_city_game
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          godot --headless --verbose --editor --quit

      - name: Export debug APK
        working-directory: task_city_game
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          test -s /root/.android/debug.keystore
          godot --headless --verbose --export-debug "Android" build/TaskCity.apk
          test -s build/TaskCity.apk
          ls -lh build/TaskCity.apk

      - name: Upload APK and source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: TaskCity-Android-v1
          path: |
            task_city_game/build/TaskCity.apk
            task_city_game/project.godot
            task_city_game/export_presets.cfg
            task_city_game/scripts/
          if-no-files-found: error
          compression-level: 6
