name: Build Task City APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'task_city_game/**'
      - '.github/workflows/build-task-city-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified V43 map artifact
        uses: actions/download-artifact@v4
        with:
          name: classic-reference-v43-natural-mountains
          path: _map_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Godnit/-
          run-id: 31722636867

      - name: Download verified cottage artifact
        uses: actions/download-artifact@v4
        with:
          name: reference-cottage-3d-v15
          path: _house_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Godnit/-
          run-id: 31811563821

      - name: Prepare game assets
        run: |
          mkdir -p task_city_game/assets task_city_game/build
          cp _map_artifact/classic_reference_v43.glb task_city_game/assets/classic_reference_v43.glb
          cp _house_artifact/model.glb task_city_game/assets/cottage.glb
          test -s task_city_game/assets/classic_reference_v43.glb
          test -s task_city_game/assets/cottage.glb
          godot --version
          ls -lh task_city_game/assets

      - name: Install Godot Android export templates
        run: |
          set -eux
          VERSION_DIR="4.3.stable"
          TARGET="/root/.cache/godot/export_templates/${VERSION_DIR}"
          mkdir -p "$TARGET"

          echo "Searching image for Android export templates..."
          DEBUG_TEMPLATE="$(find / -type f -name android_debug.apk 2>/dev/null | head -n 1 || true)"
          RELEASE_TEMPLATE="$(find / -type f -name android_release.apk 2>/dev/null | head -n 1 || true)"

          if [ -n "$DEBUG_TEMPLATE" ]; then
            echo "Found debug template: $DEBUG_TEMPLATE"
            cp "$DEBUG_TEMPLATE" "$TARGET/android_debug.apk"
          fi
          if [ -n "$RELEASE_TEMPLATE" ]; then
            echo "Found release template: $RELEASE_TEMPLATE"
            cp "$RELEASE_TEMPLATE" "$TARGET/android_release.apk"
          fi

          if [ ! -s "$TARGET/android_debug.apk" ]; then
            echo "Embedded template was not found; downloading official Godot 4.3 templates."
            apt-get update
            apt-get install -y --no-install-recommends wget unzip ca-certificates
            wget -q --tries=3 --timeout=30 -O /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
            mkdir -p /tmp/godot_templates
            unzip -q /tmp/templates.tpz -d /tmp/godot_templates
            cp /tmp/godot_templates/templates/android_debug.apk "$TARGET/android_debug.apk"
            cp /tmp/godot_templates/templates/android_release.apk "$TARGET/android_release.apk"
          fi

          test -s "$TARGET/android_debug.apk"
          test -s "$TARGET/android_release.apk"
          ls -lh "$TARGET"

      - name: Import project and validate scripts
        working-directory: task_city_game
        run: |
          godot --headless --verbose --editor --quit

      - name: Export debug APK
        working-directory: task_city_game
        run: |
          godot --headless --verbose --export-debug "Android" build/TaskCity.apk
          test -s build/TaskCity.apk
          ls -lh build/TaskCity.apk

      - name: Upload APK and source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: TaskCity-Android-v1
          path: |
            task_city_game/build/TaskCity.apk
            task_city_game/project.godot
            task_city_game/export_presets.cfg
            task_city_game/scripts/
          if-no-files-found: error
          compression-level: 6
