name: Build Farmer 2 Map

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/build_farmer2.py'
      - 'scripts/build_farmer2_fixed.py'
      - '.github/workflows/build-farmer2.yml'
  workflow_dispatch:

jobs:
  build-farmer2:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb libgl1 libglu1-mesa
          blender --version

      - name: Build Farmer 2 map in Blender headless
        run: |
          mkdir -p output_farmer2
          xvfb-run -a blender --background --python scripts/build_farmer2_fixed.py

      - name: Diagnose outputs
        if: always()
        run: |
          echo "=== output_farmer2 files ==="
          find output_farmer2 -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true

      - name: Verify Blender outputs
        run: |
          required=(
            farmer2.blend farmer2.glb
            preview_perspective.png preview_top.png
            preview_front.png preview_back.png
            preview_left.png preview_right.png
            farmer2_report.txt
          )
          fail=0
          for f in "${required[@]}"; do
            if [ -s "output_farmer2/$f" ]; then
              echo "OK $f"
            else
              echo "MISSING $f"
              fail=1
            fi
          done
          if [ -f output_farmer2/farmer2_report.txt ]; then
            cat output_farmer2/farmer2_report.txt
          fi
          exit "$fail"

      - name: Upload Farmer 2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farmer2-map-3d
          path: output_farmer2/
          if-no-files-found: warn
          compression-level: 6
