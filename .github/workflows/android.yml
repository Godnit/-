name: Build Portal Gates APK

on:
  push:
    branches: ["portal-gates", "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate lightweight Blender assets
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --background --python blender/generate_assets.py
          rm -f assets/portal_ring.blend

      - name: Remove unrelated legacy assets from the CI workspace
        run: |
          rm -rf references task_city_game

      - name: Generate Android debug keystore
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Export Godot Android APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          relative_project_path: ./
          relative_export_path: ./build
          presets_to_export: Android
          export_debug: true
          verbose: true
          cache: true

      - name: Locate exported APK
        run: |
          mkdir -p build
          APK_PATH=$(find build -type f -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found after Godot export"
            find build -maxdepth 5 -type f -print
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          if [ "$APK_PATH" != "build/PortalGates.apk" ]; then cp "$APK_PATH" build/PortalGates.apk; fi
          ls -lh build/PortalGates.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortalGates-Android8.1-APK
          path: build/PortalGates.apk
          if-no-files-found: error
          retention-days: 14
