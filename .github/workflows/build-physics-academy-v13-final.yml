name: Build Physics Academy v13 Final APK

on:
  push:
    branches: [ physics-academy-apk-v13 ]
    paths:
      - '.github/workflows/build-physics-academy-v13-final.yml'
      - 'physics-academy-v13/FINAL_BUILD_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: physics-academy-apk-v13
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reassemble verified offline academy
        run: |
          mkdir -p physics-academy-v13/app/src/main/assets
          cat \
            physics-academy-v13/payload/payload.part00 \
            physics-academy-v13/payload/payload.part01 \
            physics-academy-v13/payload/payload.part02 \
            physics-academy-v13/payload/p03q0 \
            physics-academy-v13/payload/payload.part04 \
            physics-academy-v13/payload/payload.part05 \
            physics-academy-v13/payload/payload.part06 \
            physics-academy-v13/payload/fix07a \
            physics-academy-v13/payload/fix07b \
            physics-academy-v13/payload/fix07c \
            physics-academy-v13/payload/payload.part08 \
            > /tmp/physics-academy.b64
          test "$(wc -c < /tmp/physics-academy.b64)" -eq 112664
          base64 -d /tmp/physics-academy.b64 > /tmp/physics-academy.html.bz2
          echo '05114c32b9fd8ac8acb7488b780bb210015d2c28520a938d1478f0edc433ad16  /tmp/physics-academy.html.bz2' | sha256sum -c -
          bzip2 -dc /tmp/physics-academy.html.bz2 > physics-academy-v13/app/src/main/assets/index.html
          echo 'b88262596b7e6680766a6f73cad5e3aa4fe8026b3ecd1a87e9b8103b76c1d984  physics-academy-v13/app/src/main/assets/index.html' | sha256sum -c -
          grep -q 'أكاديمية الفيزياء' physics-academy-v13/app/src/main/assets/index.html
          grep -q 'window.androidBack' physics-academy-v13/app/src/main/assets/index.html

      - name: Build APK
        run: gradle -p physics-academy-v13 :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          cp physics-academy-v13/app/build/outputs/apk/debug/app-debug.apk physics-academy-v13/Physics-Academy-v13.apk
          test -s physics-academy-v13/Physics-Academy-v13.apk
          unzip -t physics-academy-v13/Physics-Academy-v13.apk
          sha256sum physics-academy-v13/Physics-Academy-v13.apk | tee physics-academy-v13/Physics-Academy-v13.sha256
          ls -lh physics-academy-v13/Physics-Academy-v13.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Physics-Academy-v13-APK
          path: physics-academy-v13/Physics-Academy-v13.apk
          if-no-files-found: error
          compression-level: 0

      - name: Commit APK to build branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-academy-v13/Physics-Academy-v13.apk physics-academy-v13/Physics-Academy-v13.sha256
          git commit -m 'Build Physics Academy v13 APK [skip ci]'
          git push origin HEAD:physics-academy-apk-v13
