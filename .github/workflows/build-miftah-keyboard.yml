name: Build Miftah Keyboard APK

on:
  push:
    branches: [miftah-keyboard-v1]
    paths:
      - 'custom_keyboard_android/**'
      - '.github/workflows/build-miftah-keyboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: custom_keyboard_android
        run: gradle --no-daemon --stacktrace app:assembleDebug

      - name: Verify APK and rename
        shell: bash
        run: |
          set -euo pipefail
          src=custom_keyboard_android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$src"
          mkdir -p release
          cp "$src" release/Miftah-Keyboard-v1.0.apk
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose release/Miftah-Keyboard-v1.0.apk
          sha256sum release/Miftah-Keyboard-v1.0.apk > release/SHA256SUMS.txt
          ls -lh release/Miftah-Keyboard-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Miftah-Keyboard-v1.0-APK
          path: |
            release/Miftah-Keyboard-v1.0.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
