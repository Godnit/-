name: Build Floating Screenshot V2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-floating-screenshot-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout floating screenshot branch
        uses: actions/checkout@v4
        with:
          ref: floating-screenshot-v2

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9 directly
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo '/opt/gradle/gradle-8.9/bin' >> "$GITHUB_PATH"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK
        shell: bash
        working-directory: floating_screenshot_v2
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: floating-screenshot-v2-debug
          path: floating_screenshot_v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
