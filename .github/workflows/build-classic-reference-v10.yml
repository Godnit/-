name: Build Classic Reference V23

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/build_classic_reference_v16.py'
      - 'scripts/build_classic_reference_v20.py'
      - 'scripts/build_classic_reference_v22.py'
      - 'scripts/build_classic_reference_v23.py'
      - '.github/workflows/build-classic-reference-v10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb libgl1 libglu1-mesa imagemagick
          blender --version

      - name: Build and render corrected 3D scene
        run: |
          rm -rf output_classic_reference_v23
          mkdir -p output_classic_reference_v23
          xvfb-run -a blender --background --python-exit-code 1 --python scripts/build_classic_reference_v23.py
          convert output_classic_reference_v23/preview_main.png -resize 240x135 -quality 45 output_classic_reference_v23/preview_thumb.jpg

      - name: Verify outputs
        run: |
          required=(
            classic_reference_v23.blend
            preview_main.png preview_closer.png
            preview_left.png preview_right.png preview_high.png preview_thumb.jpg
            report.txt
          )
          failed=0
          for f in "${required[@]}"; do
            if [ -s "output_classic_reference_v23/$f" ]; then
              echo "OK $f"
            else
              echo "MISSING $f"
              failed=1
            fi
          done
          if [ -s output_classic_reference_v23/classic_reference_v23.glb ]; then echo "OK optional GLB"; fi
          cat output_classic_reference_v23/report.txt || true
          find output_classic_reference_v23 -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          exit "$failed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: classic-reference-v23-3d
          path: output_classic_reference_v23/
          if-no-files-found: error
          compression-level: 6

      - name: Publish outputs
        run: |
          rm -rf /tmp/v23-publish
          mkdir -p /tmp/v23-publish
          cp -a output_classic_reference_v23/. /tmp/v23-publish/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin render-output >/dev/null 2>&1; then
            git fetch origin render-output
            git checkout -B render-output origin/render-output
            git rm -rf .
          else
            git checkout --orphan render-output
            git rm -rf . || true
          fi
          cp -a /tmp/v23-publish/. .
          git add -A
          git commit -m "Publish TABS classic reference V23 outputs" || true
          git push --force origin render-output
