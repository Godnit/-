name: Camera Test V36

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/build_classic_reference_v16.py'
      - 'scripts/build_classic_reference_v24.py'
      - 'scripts/build_classic_reference_v26.py'
      - 'scripts/build_classic_reference_v27.py'
      - 'scripts/postprocess_classic_v35.py'
      - 'scripts/camera_test_v36.py'
      - '.github/workflows/build-classic-reference-v10.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb libgl1 libglu1-mesa python3-numpy
      - name: Build V35 reference scene
        run: |
          rm -rf output_classic_reference_v27 output_classic_reference_v35 output_camera_v36
          PYTHONPATH=/usr/lib/python3/dist-packages xvfb-run -a blender --background --python-exit-code 1 --python scripts/build_classic_reference_v27.py
          PYTHONPATH=/usr/lib/python3/dist-packages xvfb-run -a blender --background output_classic_reference_v27/classic_reference_v27.blend --python-exit-code 1 --python scripts/postprocess_classic_v35.py
      - name: Render four camera candidates
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages xvfb-run -a blender --background output_classic_reference_v35/classic_reference_v35.blend --python-exit-code 1 --python scripts/camera_test_v36.py
          for f in A B C D; do test -s "output_camera_v36/candidate_$f.png" || exit 1; done
          cat output_camera_v36/report.txt
      - name: Upload camera test
        uses: actions/upload-artifact@v4
        with:
          name: camera-test-v36
          path: output_camera_v36/
          if-no-files-found: error
          compression-level: 6
