name: Build Classic Reference V37

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/build_classic_reference_v16.py'
      - 'scripts/build_classic_reference_v24.py'
      - 'scripts/build_classic_reference_v26.py'
      - 'scripts/build_classic_reference_v27.py'
      - 'scripts/postprocess_classic_v35.py'
      - 'scripts/finalize_classic_v37.py'
      - '.github/workflows/build-classic-reference-v10.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb libgl1 libglu1-mesa python3-numpy
      - name: Build map-only base and V35 mountains
        run: |
          rm -rf output_classic_reference_v27 output_classic_reference_v35 output_classic_reference_v37
          PYTHONPATH=/usr/lib/python3/dist-packages xvfb-run -a blender --background --python-exit-code 1 --python scripts/build_classic_reference_v27.py
          PYTHONPATH=/usr/lib/python3/dist-packages xvfb-run -a blender --background output_classic_reference_v27/classic_reference_v27.blend --python-exit-code 1 --python scripts/postprocess_classic_v35.py
      - name: Finalize V37
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages xvfb-run -a blender --background output_classic_reference_v35/classic_reference_v35.blend --python-exit-code 1 --python scripts/finalize_classic_v37.py
      - name: Verify outputs
        run: |
          for f in classic_reference_v37.blend classic_reference_v37.glb preview_main.png preview_closer.png preview_left.png preview_right.png preview_high.png report.txt; do test -s "output_classic_reference_v37/$f" || exit 1; done
          cat output_classic_reference_v37/report.txt
          ls -lh output_classic_reference_v37/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: classic-reference-v37-map-only
          path: output_classic_reference_v37/
          if-no-files-found: error
          compression-level: 6
