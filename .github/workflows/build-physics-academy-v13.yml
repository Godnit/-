name: Build Physics Academy v14 APK

on:
  push:
    branches: [ physics-academy-apk-v13 ]
    paths:
      - 'physics-academy-v13/**'
      - '.github/workflows/build-physics-academy-v13.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore offline academy asset
        run: |
          mkdir -p physics-academy-v13/app/src/main/assets
          gzip -dc physics-academy-v13/payload/index.html.gz > physics-academy-v13/app/src/main/assets/index.html
          test -s physics-academy-v13/app/src/main/assets/index.html
          grep -q 'أكاديمية الفيزياء' physics-academy-v13/app/src/main/assets/index.html
          grep -q 'window.androidBack' physics-academy-v13/app/src/main/assets/index.html
          wc -c physics-academy-v13/app/src/main/assets/index.html

      - name: Build signed release APK
        run: gradle -p physics-academy-v13 :app:assembleRelease --stacktrace

      - name: Verify and prepare APK
        run: |
          cp physics-academy-v13/app/build/outputs/apk/release/app-release.apk Physics-Academy-v14.apk
          test -s Physics-Academy-v14.apk
          unzip -t Physics-Academy-v14.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs Physics-Academy-v14.apk
          unzip -l Physics-Academy-v14.apk | grep -E 'assets/index.html|res/drawable.*/ic_launcher|resources.arsc|classes.dex'
          sha256sum Physics-Academy-v14.apk
          ls -lh Physics-Academy-v14.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Physics-Academy-v14-APK
          path: Physics-Academy-v14.apk
          if-no-files-found: error
          compression-level: 0
