name: Build Pastel Valley 3D

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/build_pastel_valley.py'
      - '.github/workflows/build-pastel-valley.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb libgl1 libglu1-mesa
          blender --version

      - name: Build and render scene
        run: |
          mkdir -p output_pastel_valley
          xvfb-run -a blender --background --python scripts/build_pastel_valley.py

      - name: Diagnose outputs
        if: always()
        run: |
          echo "=== output_pastel_valley files ==="
          find output_pastel_valley -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true

      - name: Verify outputs
        run: |
          required=(pastel_valley.blend pastel_valley.glb preview_main.png preview_left.png preview_right.png preview_high.png report.txt)
          failed=0
          for f in "${required[@]}"; do
            if [ -s "output_pastel_valley/$f" ]; then
              echo "OK $f"
            else
              echo "MISSING $f"
              failed=1
            fi
          done
          [ -f output_pastel_valley/report.txt ] && cat output_pastel_valley/report.txt || true
          exit "$failed"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pastel-valley-3d
          path: output_pastel_valley/
          if-no-files-found: warn
          compression-level: 6
