name: Build TABS Legacy Map 3D

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/build_reference_valley_v2.py'
      - 'scripts/build_reference_valley_v8.py'
      - 'scripts/build_reference_valley_v9.py'
      - 'scripts/build_reference_valley_v10.py'
      - '.github/workflows/build-pastel-valley.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb libgl1 libglu1-mesa
          blender --version

      - name: Build TABS Legacy map in Blender
        run: |
          rm -rf output_tabs_legacy_v10
          mkdir -p output_tabs_legacy_v10
          xvfb-run -a blender --background --python scripts/build_reference_valley_v10.py

      - name: Verify outputs
        run: |
          required=(tabs_legacy_reference_v10.blend preview_main.png preview_left.png preview_right.png preview_top.png preview_church.png preview_back.png report.txt)
          failed=0
          for f in "${required[@]}"; do
            if [ -s "output_tabs_legacy_v10/$f" ]; then
              echo "OK $f"
            else
              echo "MISSING $f"
              failed=1
            fi
          done
          if [ -s output_tabs_legacy_v10/tabs_legacy_reference_v10.glb ]; then
            echo "OK tabs_legacy_reference_v10.glb"
          else
            echo "WARNING: GLB missing; BLEND remains primary deliverable"
          fi
          cat output_tabs_legacy_v10/report.txt || true
          exit "$failed"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabs-legacy-map-v10-3d
          path: output_tabs_legacy_v10/
          if-no-files-found: error
          compression-level: 6
