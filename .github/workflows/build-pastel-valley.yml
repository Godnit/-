name: Build Pastel Valley 3D

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/build_reference_valley_v2.py'
      - 'scripts/build_reference_valley_v8.py'
      - 'scripts/build_reference_valley_v9.py'
      - '.github/workflows/build-pastel-valley.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb libgl1 libglu1-mesa
          blender --version

      - name: Build and render corrected 3D scene
        run: |
          mkdir -p output_reference_valley_v9
          xvfb-run -a blender --background --python scripts/build_reference_valley_v9.py

      - name: Verify outputs
        run: |
          required=(reference_valley_v9.blend preview_main.png preview_closer.png report.txt)
          failed=0
          for f in "${required[@]}"; do
            if [ -s "output_reference_valley_v9/$f" ]; then
              echo "OK $f"
            else
              echo "MISSING $f"
              failed=1
            fi
          done
          [ -f output_reference_valley_v9/report.txt ] && cat output_reference_valley_v9/report.txt || true
          exit "$failed"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-valley-v9-3d
          path: output_reference_valley_v9/
          if-no-files-found: warn
          compression-level: 6
